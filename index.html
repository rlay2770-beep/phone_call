<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advanced Video Call & Chat App</title>

  <!-- Firebase Web SDK v10.8.0 (Compat Mode) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #121212; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 10px; }
    
    .app-card { background: #1e1e1e; width: 100%; max-width: 420px; height: 92vh; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: flex; flex-direction: column; overflow: hidden; position: relative; border: 1px solid #333; }
    .hidden { display: none !important; }

    /* Auth Styling */
    .auth-box { padding: 30px 20px; display: flex; flex-direction: column; gap: 15px; justify-content: center; height: 100%; text-align: center; }
    .input-dark { padding: 14px; background: #2a2a2a; border: 1px solid #444; border-radius: 10px; color: white; font-size: 14px; width: 100%; outline: none; }
    .btn-main { background: #0a84ff; color: white; padding: 14px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 14px; }
    
    /* App Navigation & Header */
    .app-header { background: #252525; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; }
    .header-user { font-size: 13px; font-weight: 600; color: #0a84ff; max-width: 60%; overflow: hidden; text-overflow: ellipsis; }
    .btn-logout { background: #ff453a; color: white; border: none; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; }

    /* Bottom Navigation Tabs */
    .tab-bar { display: flex; background: #252525; border-top: 1px solid #333; }
    .tab-btn { flex: 1; padding: 12px; text-align: center; background: none; border: none; color: #8e8e93; font-weight: 600; font-size: 13px; cursor: pointer; }
    .tab-btn.active { color: #0a84ff; border-top: 2px solid #0a84ff; }

    /* Contacts Section */
    .section-container { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .contact-add-bar { padding: 10px; background: #2a2a2a; display: flex; gap: 6px; border-bottom: 1px solid #333; }
    .contact-list { flex: 1; overflow-y: auto; padding: 10px; }
    .contact-card { background: #2c2c2e; padding: 12px; border-radius: 10px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; border: 1px solid #3a3a3c; }
    .contact-card:hover { background: #3a3a3c; }
    .contact-info { display: flex; flex-direction: column; }
    .contact-name { font-weight: bold; font-size: 14px; }
    .contact-email { font-size: 11px; color: #8e8e93; }

    /* Chat Section */
    .chat-header { background: #1c1c1e; padding: 10px 14px; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; }
    .call-btn-group { display: flex; gap: 8px; }
    .btn-call { border: none; padding: 8px 12px; border-radius: 8px; font-weight: bold; font-size: 12px; color: white; cursor: pointer; }
    .btn-voice { background: #30d158; }
    .btn-video { background: #5e5ce6; }

    .chat-box { flex: 1; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; background: #141414; }
    .msg { padding: 10px 14px; border-radius: 14px; font-size: 13px; max-width: 75%; word-break: break-word; }
    .msg.me { background: #0a84ff; color: white; align-self: flex-end; }
    .msg.them { background: #2c2c2e; color: white; align-self: flex-start; }

    .input-bar { padding: 10px; background: #1c1c1e; border-top: 1px solid #333; display: flex; gap: 8px; }
    .input-bar textarea { flex: 1; padding: 10px; background: #2c2c2e; border: 1px solid #3a3a3c; border-radius: 8px; color: white; font-size: 13px; resize: none; height: 40px; outline: none; }
    .btn-send { background: #0a84ff; color: white; border: none; padding: 0 16px; border-radius: 8px; font-weight: bold; cursor: pointer; }

    /* Video & Voice Call Screen Overlay */
    .call-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; color: white; display: flex; flex-direction: column; justify-content: space-between; align-items: center; z-index: 1000; text-align: center; padding: 30px 15px; }
    .video-container { position: relative; width: 100%; flex: 1; background: #1c1c1e; border-radius: 16px; overflow: hidden; display: flex; justify-content: center; align-items: center; margin: 15px 0; }
    #remoteVideo { width: 100%; height: 100%; object-fit: cover; }
    #localVideo { position: absolute; top: 12px; right: 12px; width: 100px; height: 140px; object-fit: cover; border-radius: 10px; border: 2px solid #fff; background: #2c2c2e; }
    
    .call-controls { display: flex; gap: 12px; }
    .btn-call-action { padding: 14px 24px; border-radius: 30px; border: none; font-weight: bold; color: white; cursor: pointer; font-size: 14px; }
    .btn-flash { background: #ffd60a; color: #000; }
    .btn-accept-call { background: #30d158; }
    .btn-end-call { background: #ff453a; }
  </style>
</head>
<body>

<div class="app-card" id="appCard">
  
  <!-- 1. Auth Section -->
  <div id="authSection" class="auth-box">
    <h2 style="color: #0a84ff;">အကောင့်ဝင်ရောက်ရန်</h2>
    <input type="email" id="emailInput" class="input-dark" placeholder="အီးမေးလ် ထည့်ပါ">
    <input type="password" id="passInput" class="input-dark" placeholder="စကားဝှက် ထည့်ပါ">
    <button class="btn-main" onclick="loginWithEmail()">အကောင့်ဝင်မည် / အကောင့်သစ်ဖွင့်မည်</button>
  </div>

  <!-- 2. Main Application -->
  <div id="appSection" class="hidden" style="display: flex; flex-direction: column; height: 100%;">
    
    <!-- Top Bar -->
    <div class="app-header">
      <div class="header-user" id="userNameDisplay">...</div>
      <button class="btn-logout" onclick="confirmLogout()">ထွက်မည်</button>
    </div>

    <!-- Contact List Tab Content -->
    <div id="contactsTab" class="section-container">
      <div class="contact-add-bar">
        <input type="email" id="newContactEmail" class="input-dark" placeholder="အသစ်ထည့်မည့် Email..." style="font-size: 12px; padding: 8px;">
        <button class="btn-main" onclick="saveContact()" style="padding: 8px 12px; font-size: 12px; white-space: nowrap;">Contact သိမ်းမည်</button>
      </div>
      <div class="contact-list" id="contactListContainer">
        <!-- Dynamic Contacts Loaded Here -->
      </div>
    </div>

    <!-- Chat Tab Content -->
    <div id="chatTab" class="section-container hidden">
      <div class="chat-header">
        <div style="font-size: 13px; font-weight: bold;" id="selectedChatUserName">အကောင့် ရွေးချယ်မထားပါ</div>
        <div class="call-btn-group">
          <button class="btn-call btn-voice" onclick="startCall('audio')">📞 Voice</button>
          <button class="btn-call btn-video" onclick="startCall('video')">📹 Video</button>
        </div>
      </div>
      
      <div class="chat-box" id="chatBox">
        <div style="text-align: center; color: #8e8e93; font-size: 12px; margin-top: 20px;" id="chatPlaceholder">
          Contacts Tab မှ စကားပြောလိုသည့် အကောင့်ကို နှိပ်ပြီး ရွေးချယ်ပါ။
        </div>
      </div>

      <div class="input-bar">
        <textarea id="msgInput" placeholder="စာရိုက်ပါ..."></textarea>
        <button class="btn-send" onclick="sendMessage()">ပို့မည်</button>
      </div>
    </div>

    <!-- Bottom Tab Navigation -->
    <div class="tab-bar">
      <button class="tab-btn active" id="btnTabContacts" onclick="switchTab('contacts')">👥 အဆက်အသွယ်များ</button>
      <button class="tab-btn" id="btnTabChat" onclick="switchTab('chat')">💬 စကားပြောရန်</button>
    </div>

  </div>

  <!-- 3. Video / Voice Call Overlay -->
  <div id="callOverlay" class="call-overlay hidden">
    <h4 id="callStatusText" style="color: #0a84ff;">ဖုန်းခေါ်ဆိုနေပါသည်...</h4>
    
    <div class="video-container">
      <video id="remoteVideo" autoplay playsinline></video>
      <video id="localVideo" autoplay playsinline muted></video>
    </div>

    <div class="call-controls" id="callControls">
      <button class="btn-call-action btn-flash" id="flashBtn" onclick="toggleFlashlight()">⚡ Flash</button>
      <button class="btn-call-action btn-end-call" onclick="hangUpCall()">ဖုန်းချမည်</button>
    </div>
  </div>

</div>

<script>
  // Firebase App Config
  const firebaseConfig = {
    apiKey: "AIzaSyCxM61dhkI992k0SZZQNRimqEIp5DM4PaE",
    authDomain: "phone-call-bcb5d.firebaseapp.com",
    projectId: "phone-call-bcb5d",
    storageBucket: "phone-call-bcb5d.firebasestorage.app",
    messagingSenderId: "479656547247",
    appId: "1:479656547247:web:d6ae8a8903282e3856955a"
  };

  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  let currentUser = null;
  let selectedUser = null;
  let callUnsubscribe = null;

  // WebRTC Variables
  let localStream = null;
  let remoteStream = null;
  let peerConnection = null;
  let currentCallDocId = null;
  let isFlashOn = false;

  const rtcServers = {
    iceServers: [{ urls: ['stun:stun1.l.google.com:19302', 'stun:stun2.l.google.com:19302'] }]
  };

  // Auth Handling
  auth.onAuthStateChanged(user => {
    if (user) {
      currentUser = user;
      document.getElementById('authSection').classList.add('hidden');
      document.getElementById('appSection').classList.remove('hidden');
      document.getElementById('userNameDisplay').innerText = user.email;

      db.collection("users").doc(user.uid).set({
        email: user.email.toLowerCase(),
        uid: user.uid
      }, { merge: true });

      loadContacts();
      listenIncomingCalls();
    } else {
      document.getElementById('authSection').classList.remove('hidden');
      document.getElementById('appSection').classList.add('hidden');
    }
  });

  function loginWithEmail() {
    const email = document.getElementById('emailInput').value.trim();
    const pass = document.getElementById('passInput').value.trim();
    if(!email || !pass) return alert("Email နှင့် Password ထည့်ပါ");
    auth.signInWithEmailAndPassword(email, pass).catch(() => {
      auth.createUserWithEmailAndPassword(email, pass).catch(e => alert(e.message));
    });
  }

  function confirmLogout() {
    auth.signOut();
  }

  // Navigation Tabs Logic
  function switchTab(tab) {
    if (tab === 'contacts') {
      document.getElementById('contactsTab').classList.remove('hidden');
      document.getElementById('chatTab').classList.add('hidden');
      document.getElementById('btnTabContacts').classList.add('active');
      document.getElementById('btnTabChat').classList.remove('active');
    } else {
      document.getElementById('contactsTab').classList.add('hidden');
      document.getElementById('chatTab').classList.remove('hidden');
      document.getElementById('btnTabChat').classList.add('active');
      document.getElementById('btnTabContacts').classList.remove('active');
    }
  }

  // --- Contacts Management ---
  function saveContact() {
    const email = document.getElementById('newContactEmail').value.trim().toLowerCase();
    if (!email) return alert("Email ရိုက်ထည့်ပါ");
    if (email === currentUser.email) return alert("မိမိ Email ကို သိမ်း၍ မရပါ");

    db.collection("users").doc(currentUser.uid).collection("contacts").doc(email.replace(/[^a-zA-Z0-9]/g, "_")).set({
      email: email
    }).then(() => {
      alert("Contact သိမ်းဆည်းပြီးပါပြီ");
      document.getElementById('newContactEmail').value = '';
      loadContacts();
    });
  }

  function loadContacts() {
    db.collection("users").doc(currentUser.uid).collection("contacts").onSnapshot(snap => {
      const container = document.getElementById('contactListContainer');
      container.innerHTML = '';
      if (snap.empty) {
        container.innerHTML = `<div style="text-align:center; color:#8e8e93; font-size:12px; margin-top:20px;">Contact စာရင်း မရှိသေးပါ။ အထက်တွင် Email ထည့်၍ သိမ်းပါ။</div>`;
        return;
      }
      snap.forEach(doc => {
        const c = doc.data();
        const card = document.createElement('div');
        card.className = 'contact-card';
        card.innerHTML = `
          <div class="contact-info">
            <span class="contact-name">${c.email.split('@')[0]}</span>
            <span class="contact-email">${c.email}</span>
          </div>
          <span style="color:#0a84ff; font-size:12px; font-weight:bold;">💬 စကားပြောမည်</span>
        `;
        card.onclick = () => selectUserToChat(c.email);
        container.appendChild(card);
      });
    });
  }

  async function selectUserToChat(email) {
    const snap = await db.collection("users").where("email", "==", email).get();
    if (!snap.empty) {
      snap.forEach(doc => selectedUser = doc.data());
    } else {
      selectedUser = { uid: "user_" + email.replace(/[^a-zA-Z0-9]/g, "_"), email: email };
    }
    document.getElementById('selectedChatUserName').innerText = selectedUser.email;
    document.getElementById('chatPlaceholder').classList.add('hidden');
    switchTab('chat');
    listenMessages();
  }

  // Messaging System
  function listenMessages() {
    if (!selectedUser) return;
    const roomId = currentUser.uid < selectedUser.uid ? `${currentUser.uid}_${selectedUser.uid}` : `${selectedUser.uid}_${currentUser.uid}`;
    
    db.collection("chats").doc(roomId).collection("messages").orderBy("timestamp", "asc")
      .onSnapshot(snap => {
        const box = document.getElementById('chatBox');
        box.innerHTML = '';
        snap.forEach(doc => {
          const m = doc.data();
          const div = document.createElement('div');
          div.className = `msg ${m.senderUid === currentUser.uid ? 'me' : 'them'}`;
          div.innerText = m.text;
          box.appendChild(div);
        });
        box.scrollTop = box.scrollHeight;
      });
  }

  function sendMessage() {
    if (!selectedUser) return alert("အဆက်အသွယ်များထဲမှ လူတစ်ဦးကို အရင်ရွေးချယ်ပါ");
    const input = document.getElementById('msgInput');
    if (!input.value.trim()) return;

    const roomId = currentUser.uid < selectedUser.uid ? `${currentUser.uid}_${selectedUser.uid}` : `${selectedUser.uid}_${currentUser.uid}`;
    db.collection("chats").doc(roomId).collection("messages").add({
      text: input.value,
      senderUid: currentUser.uid,
      timestamp: firebase.firestore.FieldValue.serverTimestamp()
    }).then(() => input.value = '');
  }

  // --- Fixed WebRTC Video & Audio Engine ---
  async function startCall(type) {
    if (!selectedUser) return alert("ဖုန်းခေါ်ဆိုရန် အဆက်အသွယ် ရွေးချယ်ပါ");

    const callDoc = db.collection("calls").doc();
    currentCallDocId = callDoc.id;

    document.getElementById('callOverlay').classList.remove('hidden');
    document.getElementById('callStatusText').innerText = `${selectedUser.email} သို့ ခေါ်ဆိုနေပါသည်...`;

    localStream = await navigator.mediaDevices.getUserMedia({ video: type === 'video', audio: true });
    remoteStream = new MediaStream();

    document.getElementById('localVideo').srcObject = localStream;
    document.getElementById('remoteVideo').srcObject = remoteStream;

    peerConnection = new RTCPeerConnection(rtcServers);
    localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

    peerConnection.ontrack = event => {
      event.streams[0].getTracks().forEach(track => remoteStream.addTrack(track));
    };

    const offerCandidates = callDoc.collection("offerCandidates");
    peerConnection.onicecandidate = event => {
      if (event.candidate) offerCandidates.add(event.candidate.toJSON());
    };

    const offerDescription = await peerConnection.createOffer();
    await peerConnection.setLocalDescription(offerDescription);

    await callDoc.set({
      offer: { type: offerDescription.type, sdp: offerDescription.sdp },
      callerEmail: currentUser.email,
      receiverUid: selectedUser.uid,
      callType: type,
      status: "calling"
    });

    // Listener for Answer and Disconnect Handling
    callUnsubscribe = callDoc.onSnapshot(snapshot => {
      const data = snapshot.data();
      if (peerConnection && !peerConnection.currentRemoteDescription && data && data.answer) {
        const answerDescription = new RTCSessionDescription(data.answer);
        peerConnection.setRemoteDescription(answerDescription);
        document.getElementById('callStatusText').innerText = "ချိတ်ဆက်လိုက်ပါပြီ";
      }
      if (data && data.status === "ended") {
        hangUpCall(false); // Auto hang up if remote hangs up
      }
    });

    callDoc.collection("answerCandidates").onSnapshot(snapshot => {
      snapshot.docChanges().forEach(change => {
        if (change.type === "added") {
          peerConnection.addIceCandidate(new RTCIceCandidate(change.doc.data()));
        }
      });
    });
  }

  function listenIncomingCalls() {
    db.collection("calls").where("receiverUid", "==", currentUser.uid).where("status", "==", "calling")
      .onSnapshot(snapshot => {
        snapshot.docChanges().forEach(async change => {
          if (change.type === "added") {
            const data = change.doc.data();
            currentCallDocId = change.doc.id;

            document.getElementById('callOverlay').classList.remove('hidden');
            document.getElementById('callStatusText').innerText = `${data.callerEmail} ထံမှ ${data.callType === 'video' ? 'Video' : 'Voice'} Call ဝင်လာပါသည်...`;

            document.getElementById('callControls').innerHTML = `
              <button class="btn-call-action btn-accept-call" onclick="answerCall('${data.callType}')">ကိုင်မည်</button>
              <button class="btn-call-action btn-end-call" onclick="hangUpCall(true)">ငြင်းမည်</button>
            `;

            // Auto disconnect listener while ringing
            callUnsubscribe = db.collection("calls").doc(currentCallDocId).onSnapshot(docSnap => {
              if (docSnap.exists && docSnap.data().status === "ended") {
                hangUpCall(false);
              }
            });
          }
        });
      });
  }

  async function answerCall(type) {
    const callDoc = db.collection("calls").doc(currentCallDocId);
    
    localStream = await navigator.mediaDevices.getUserMedia({ video: type === 'video', audio: true });
    remoteStream = new MediaStream();

    document.getElementById('localVideo').srcObject = localStream;
    document.getElementById('remoteVideo').srcObject = remoteStream;

    peerConnection = new RTCPeerConnection(rtcServers);
    localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

    peerConnection.ontrack = event => {
      event.streams[0].getTracks().forEach(track => remoteStream.addTrack(track));
    };

    const answerCandidates = callDoc.collection("answerCandidates");
    peerConnection.onicecandidate = event => {
      if (event.candidate) answerCandidates.add(event.candidate.toJSON());
    };

    const callData = (await callDoc.get()).data();
    await peerConnection.setRemoteDescription(new RTCSessionDescription(callData.offer));

    const answerDescription = await peerConnection.createAnswer();
    await peerConnection.setLocalDescription(answerDescription);

    await callDoc.update({
      answer: { type: answerDescription.type, sdp: answerDescription.sdp },
      status: "connected"
    });

    callDoc.collection("offerCandidates").onSnapshot(snapshot => {
      snapshot.docChanges().forEach(change => {
        if (change.type === "added") {
          peerConnection.addIceCandidate(new RTCIceCandidate(change.doc.data()));
        }
      });
    });

    document.getElementById('callControls').innerHTML = `
      <button class="btn-call-action btn-flash" id="flashBtn" onclick="toggleFlashlight()">⚡ Flash</button>
      <button class="btn-call-action btn-end-call" onclick="hangUpCall(true)">ဖုန်းချမည်</button>
    `;
  }

  // Clean End Call Logic
  function hangUpCall(notifyRemote = true) {
    if (notifyRemote && currentCallDocId) {
      db.collection("calls").doc(currentCallDocId).update({ status: "ended" });
    }

    if (callUnsubscribe) callUnsubscribe();
    if (localStream) localStream.getTracks().forEach(track => track.stop());
    if (peerConnection) peerConnection.close();

    localStream = null;
    remoteStream = null;
    peerConnection = null;
    currentCallDocId = null;

    document.getElementById('callOverlay').classList.add('hidden');
  }

  // Camera Flashlight Control
  async function toggleFlashlight() {
    if (!localStream) return;
    const videoTrack = localStream.getVideoTracks()[0];
    if (videoTrack) {
      try {
        isFlashOn = !isFlashOn;
        await videoTrack.applyConstraints({
          advanced: [{ torch: isFlashOn }]
        });
      } catch (e) {
        alert("ဤ Device တွင် Flashlight ထိန်းချုပ်ခွင့် မရှိပါ သို့မဟုတ် Support မလုပ်ပါ");
      }
    }
  }
</script>
</body>
</html>
