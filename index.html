<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Call & Chat App</title>

  <!-- Firebase Web SDK v10.8.0 (Compat Mode) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #eef2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 10px; }
    
    .app-card { background: #ffffff; width: 100%; max-width: 420px; height: 92vh; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); display: flex; flex-direction: column; overflow: hidden; position: relative; }
    .hidden { display: none !important; }

    /* Auth Styling */
    .auth-box { padding: 25px 20px; display: flex; flex-direction: column; gap: 12px; justify-content: center; height: 100%; text-align: center; overflow-y: auto; }
    .input-auth { padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px; width: 100%; }
    .btn-auth { background: #007aff; color: white; padding: 12px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 14px; }
    .btn-google { background: #4285f4; color: white; padding: 12px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 14px; }

    /* App Layout */
    .app-header { background: #007aff; color: white; padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; }
    .header-user { font-size: 12px; font-weight: 600; max-width: 45%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .header-actions { display: flex; gap: 4px; }
    .btn-action { color: white; border: none; padding: 6px 10px; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; }
    .btn-voice { background: #28a745; }
    .btn-video { background: #5856d6; }
    .btn-logout { background: #ff3b30; }

    /* User Connect Bar */
    .search-bar { background: #f8f9fa; border-bottom: 1px solid #e9ecef; padding: 8px; display: flex; gap: 6px; }
    .search-input { flex: 1; padding: 6px 10px; border: 1px solid #ced4da; border-radius: 12px; font-size: 12px; }
    .btn-search { background: #007aff; color: white; border: none; padding: 0 12px; border-radius: 12px; font-size: 12px; cursor: pointer; }

    .users-bar { background: #ffffff; border-bottom: 1px solid #e9ecef; padding: 6px 8px; }
    .user-chip { background: #e9ecef; border: 1px solid #ced4da; padding: 4px 10px; border-radius: 16px; font-size: 12px; cursor: pointer; white-space: nowrap; display: inline-block; margin-right: 4px; }
    .user-chip.active { background: #007aff; color: white; border-color: #007aff; }

    .chat-box { flex: 1; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; background: #fafafa; }
    .msg { padding: 8px 12px; border-radius: 12px; font-size: 13px; max-width: 80%; word-break: break-word; }
    .msg.me { background: #007aff; color: white; align-self: flex-end; }
    .msg.them { background: #e9ecef; color: #212529; align-self: flex-start; }

    .input-bar { padding: 8px; background: #fff; border-top: 1px solid #e9ecef; display: flex; gap: 6px; }
    .input-bar textarea { flex: 1; padding: 8px; border: 1px solid #ced4da; border-radius: 8px; font-size: 13px; resize: none; height: 42px; }
    .btn-send { background: #007aff; color: white; border: none; padding: 0 14px; border-radius: 8px; font-weight: bold; cursor: pointer; }

    /* Video Call Overlay */
    .call-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #1c1c1e; color: white; display: flex; flex-direction: column; justify-content: space-between; align-items: center; z-index: 500; text-align: center; padding: 20px 10px; }
    .video-container { position: relative; width: 100%; height: 75%; background: #000; border-radius: 12px; overflow: hidden; display: flex; justify-content: center; align-items: center; }
    #remoteVideo { width: 100%; height: 100%; object-fit: cover; }
    #localVideo { position: absolute; top: 10px; right: 10px; width: 90px; height: 130px; object-fit: cover; border-radius: 8px; border: 2px solid #fff; background: #333; }
    .call-controls { display: flex; gap: 15px; margin-bottom: 20px; }
    .btn-call-action { padding: 12px 24px; border-radius: 25px; border: none; font-weight: bold; color: white; cursor: pointer; font-size: 14px; }
    .btn-accept-call { background: #34c759; }
    .btn-end-call { background: #ff3b30; }
  </style>
</head>
<body>

<div class="app-card" id="appCard">
  <div id="recaptcha-container"></div>

  <!-- 1. Auth Section -->
  <div id="authSection" class="auth-box">
    <h2>အကောင့်ဝင်ရောက်ရန်</h2>
    <input type="email" id="emailInput" class="input-auth" placeholder="အီးမေးလ် ထည့်ပါ">
    <input type="password" id="passInput" class="input-auth" placeholder="စကားဝှက် ထည့်ပါ">
    <button class="btn-auth" onclick="loginWithEmail()">Email ဖြင့် ဝင်မည် / အကောင့်ဖွင့်မည်</button>
    <hr style="margin: 5px 0; border: 0.5px solid #eee;">
    <button class="btn-google" onclick="loginWithGoogle()">Google Account ဖြင့် ဝင်မည်</button>
  </div>

  <!-- 2. Main App Section -->
  <div id="appSection" class="hidden" style="display: flex; flex-direction: column; height: 100%;">
    <div class="app-header">
      <div class="header-user" id="userNameDisplay">...</div>
      <div class="header-actions">
        <button class="btn-action btn-voice" onclick="initiateCall('audio')">📞 Voice</button>
        <button class="btn-action btn-video" onclick="initiateCall('video')">📹 Video</button>
        <button class="btn-action btn-logout" onclick="confirmLogout()">ထွက်</button>
      </div>
    </div>

    <!-- User Search / Connect Bar -->
    <div class="search-bar">
      <input type="email" id="targetUserEmail" class="search-input" placeholder="ပြောဆိုလိုသူ၏ Email ရိုက်ထည့်ပါ...">
      <button class="btn-search" onclick="connectUserByEmail()">ချိတ်ဆက်မည်</button>
    </div>

    <div class="users-bar">
      <div style="font-size: 11px; color: #666; margin-bottom: 3px;">လက်ရှိ စကားပြောနေသူ:</div>
      <div id="usersList"></div>
    </div>

    <div class="chat-box" id="chatBox">
      <div style="text-align: center; color: #8e8e93; font-size: 12px; margin-top: 20px;" id="chatPlaceholder">
        စာပို့ရန် သို့မဟုတ် ဖုန်းခေါ်ဆိုရန် အထက်တွင် Email ရိုက်ထည့်ပြီး "ချိတ်ဆက်မည်" ကို နှိပ်ပါ။
      </div>
    </div>

    <div class="input-bar">
      <textarea id="msgInput" placeholder="စာရိုက်ပါ..."></textarea>
      <button class="btn-send" onclick="sendMessage()">ပို့မည်</button>
    </div>
  </div>

  <!-- 3. Video / Audio Call Overlay -->
  <div id="callOverlay" class="call-overlay hidden">
    <h4 id="callStatusText">ဖုန်းခေါ်ဆိုနေပါသည်...</h4>
    
    <div class="video-container" id="videoContainer">
      <video id="remoteVideo" autoplay playsinline></video>
      <video id="localVideo" autoplay playsinline muted></video>
    </div>

    <div class="call-controls" id="callControls">
      <button class="btn-call-action btn-end-call" onclick="hangUpCall()">ဖုန်းချမည်</button>
    </div>
  </div>

</div>

<script>
  // Firebase Configuration
  const firebaseConfig = {
    apiKey: "AIzaSyCxM61dhkI992k0SZZQNRimqEIp5DM4PaE",
    authDomain: "phone-call-bcb5d.firebaseapp.com",
    projectId: "phone-call-bcb5d",
    storageBucket: "phone-call-bcb5d.firebasestorage.app",
    messagingSenderId: "479656547247",
    appId: "1:479656547247:web:d6ae8a8903282e3856955a"
  };

  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  let currentUser = null;
  let selectedUser = null;

  // WebRTC Variables
  let localStream = null;
  let remoteStream = null;
  let peerConnection = null;
  let currentCallDocId = null;

  const rtcServers = {
    iceServers: [{ urls: ['stun:stun1.l.google.com:19302', 'stun:stun2.l.google.com:19302'] }]
  };

  // Auth Observer
  auth.onAuthStateChanged(user => {
    if (user) {
      currentUser = user;
      document.getElementById('authSection').classList.add('hidden');
      document.getElementById('appSection').classList.remove('hidden');
      document.getElementById('userNameDisplay').innerText = user.email || user.displayName;

      // Save user session to Firestore
      db.collection("users").doc(user.uid).set({
        name: user.displayName || user.email.split('@')[0],
        email: user.email.toLowerCase(),
        uid: user.uid,
        online: true
      }, { merge: true });

      listenIncomingCalls();
    } else {
      document.getElementById('authSection').classList.remove('hidden');
      document.getElementById('appSection').classList.add('hidden');
    }
  });

  // Login Functions
  function loginWithEmail() {
    const email = document.getElementById('emailInput').value.trim();
    const pass = document.getElementById('passInput').value.trim();
    if(!email || !pass) return alert("Email နှင့် Password ဖြည့်ပါ");
    auth.signInWithEmailAndPassword(email, pass).catch(() => {
      auth.createUserWithEmailAndPassword(email, pass).catch(e => alert(e.message));
    });
  }

  function loginWithGoogle() {
    const provider = new firebase.auth.GoogleAuthProvider();
    auth.signInWithPopup(provider).catch(e => alert(e.message));
  }

  function confirmLogout() {
    if (currentUser) db.collection("users").doc(currentUser.uid).update({ online: false });
    auth.signOut();
  }

  // --- Email ဖြင့် ချိတ်ဆက်မည့် Function (ပြင်ဆင်ပြီး) ---
  async function connectUserByEmail() {
    const emailInput = document.getElementById('targetUserEmail');
    const email = emailInput.value.trim().toLowerCase();

    if (!email) return alert("ကျေးဇူးပြု၍ စကားပြောလိုသူ၏ Email ကို ရိုက်ထည့်ပါ");
    if (currentUser && email === currentUser.email.toLowerCase()) return alert("မိမိ Email ကို မိမိ ပြန်လည် ချိတ်ဆက်၍ မရပါ");

    try {
      const snapshot = await db.collection("users").where("email", "==", email).get();

      if (!snapshot.empty) {
        snapshot.forEach(doc => {
          selectedUser = doc.data();
        });
      } else {
        // Firestore ထဲ အကောင့်မရှိသေးပါကလည်း ID တစ်ခု ဖန်တီး၍ ချိတ်ဆက်ခွင့်ပေးမည်
        const tempUid = "user_" + email.replace(/[^a-zA-Z0-9]/g, "_");
        selectedUser = {
          uid: tempUid,
          email: email,
          name: email.split('@')[0]
        };
      }

      // UI ကို Active လုပ်ခြင်း
      document.getElementById('chatPlaceholder').classList.add('hidden');
      document.getElementById('usersList').innerHTML = `<div class="user-chip active">${selectedUser.email}</div>`;
      
      alert(`${selectedUser.email} နှင့် ချိတ်ဆက်လိုက်ပါပြီ။ စာပို့/ဖုန်းခေါ်ဆိုနိုင်ပါပြီ။`);
      
      listenMessages();
      emailInput.value = '';

    } catch (error) {
      console.error("Connection Error: ", error);
      alert("ချိတ်ဆက်မှု မအောင်မြင်ပါ: " + error.message);
    }
  }

  // Chat Listening & Sending
  function listenMessages() {
    if (!selectedUser) return;
    const roomId = currentUser.uid < selectedUser.uid ? `${currentUser.uid}_${selectedUser.uid}` : `${selectedUser.uid}_${currentUser.uid}`;
    
    db.collection("chats").doc(roomId).collection("messages").orderBy("timestamp", "asc")
      .onSnapshot(snap => {
        const box = document.getElementById('chatBox');
        box.innerHTML = '';
        snap.forEach(doc => {
          const m = doc.data();
          const div = document.createElement('div');
          div.className = `msg ${m.senderUid === currentUser.uid ? 'me' : 'them'}`;
          div.innerText = m.text;
          box.appendChild(div);
        });
        box.scrollTop = box.scrollHeight;
      });
  }

  function sendMessage() {
    if (!selectedUser) return alert("စာပို့လိုသည့် လူကို အရင်ရွေးချယ်ပါ သို့မဟုတ် Email ဖြင့် ချိတ်ဆက်ပါ");
    const input = document.getElementById('msgInput');
    if (!input.value.trim()) return;

    const roomId = currentUser.uid < selectedUser.uid ? `${currentUser.uid}_${selectedUser.uid}` : `${selectedUser.uid}_${currentUser.uid}`;
    db.collection("chats").doc(roomId).collection("messages").add({
      text: input.value,
      senderUid: currentUser.uid,
      timestamp: firebase.firestore.FieldValue.serverTimestamp()
    }).then(() => input.value = '');
  }

  // --- WebRTC Video & Voice Calling ---
  async function initiateCall(type) {
    if (!selectedUser) return alert("ဖုန်းခေါ်ဆိုရန် Email အရင်ရိုက်ထည့်ပြီး ချိတ်ဆက်ပါ");

    const callDoc = db.collection("calls").doc();
    currentCallDocId = callDoc.id;

    document.getElementById('callOverlay').classList.remove('hidden');
    document.getElementById('callStatusText').innerText = `${selectedUser.email} သို့ ခေါ်ဆိုနေပါသည်...`;

    localStream = await navigator.mediaDevices.getUserMedia({ video: type === 'video', audio: true });
    remoteStream = new MediaStream();

    document.getElementById('localVideo').srcObject = localStream;
    document.getElementById('remoteVideo').srcObject = remoteStream;

    peerConnection = new RTCPeerConnection(rtcServers);
    localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

    peerConnection.ontrack = event => {
      event.streams[0].getTracks().forEach(track => remoteStream.addTrack(track));
    };

    const offerCandidates = callDoc.collection("offerCandidates");
    peerConnection.onicecandidate = event => {
      if (event.candidate) offerCandidates.add(event.candidate.toJSON());
    };

    const offerDescription = await peerConnection.createOffer();
    await peerConnection.setLocalDescription(offerDescription);

    await callDoc.set({
      offer: { type: offerDescription.type, sdp: offerDescription.sdp },
      callerEmail: currentUser.email,
      receiverUid: selectedUser.uid,
      callType: type,
      status: "calling"
    });

    callDoc.onSnapshot(snapshot => {
      const data = snapshot.data();
      if (peerConnection && !peerConnection.currentRemoteDescription && data && data.answer) {
        const answerDescription = new RTCSessionDescription(data.answer);
        peerConnection.setRemoteDescription(answerDescription);
        document.getElementById('callStatusText').innerText = "ချိတ်ဆက်လိုက်ပါပြီ";
      }
      if (data && data.status === "ended") hangUpCall(false);
    });

    callDoc.collection("answerCandidates").onSnapshot(snapshot => {
      snapshot.docChanges().forEach(change => {
        if (change.type === "added") {
          peerConnection.addIceCandidate(new RTCIceCandidate(change.doc.data()));
        }
      });
    });
  }

  function listenIncomingCalls() {
    db.collection("calls").where("receiverUid", "==", currentUser.uid).where("status", "==", "calling")
      .onSnapshot(snapshot => {
        snapshot.docChanges().forEach(async change => {
          if (change.type === "added") {
            const data = change.doc.data();
            currentCallDocId = change.doc.id;

            document.getElementById('callOverlay').classList.remove('hidden');
            document.getElementById('callStatusText').innerText = `${data.callerEmail} ထံမှ ${data.callType === 'video' ? 'Video' : 'Voice'} Call ဝင်လာပါသည်...`;

            document.getElementById('callControls').innerHTML = `
              <button class="btn-call-action btn-accept-call" onclick="answerCall('${data.callType}')">ကိုင်မည်</button>
              <button class="btn-call-action btn-end-call" onclick="hangUpCall()">ငြင်းမည်</button>
            `;
          }
        });
      });
  }

  async function answerCall(type) {
    const callDoc = db.collection("calls").doc(currentCallDocId);
    
    localStream = await navigator.mediaDevices.getUserMedia({ video: type === 'video', audio: true });
    remoteStream = new MediaStream();

    document.getElementById('localVideo').srcObject = localStream;
    document.getElementById('remoteVideo').srcObject = remoteStream;

    peerConnection = new RTCPeerConnection(rtcServers);
    localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

    peerConnection.ontrack = event => {
      event.streams[0].getTracks().forEach(track => remoteStream.addTrack(track));
    };

    const answerCandidates = callDoc.collection("answerCandidates");
    peerConnection.onicecandidate = event => {
      if (event.candidate) answerCandidates.add(event.candidate.toJSON());
    };

    const callData = (await callDoc.get()).data();
    await peerConnection.setRemoteDescription(new RTCSessionDescription(callData.offer));

    const answerDescription = await peerConnection.createAnswer();
    await peerConnection.setLocalDescription(answerDescription);

    await callDoc.update({
      answer: { type: answerDescription.type, sdp: answerDescription.sdp },
      status: "connected"
    });

    callDoc.collection("offerCandidates").onSnapshot(snapshot => {
      snapshot.docChanges().forEach(change => {
        if (change.type === "added") {
          peerConnection.addIceCandidate(new RTCIceCandidate(change.doc.data()));
        }
      });
    });

    document.getElementById('callControls').innerHTML = `
      <button class="btn-call-action btn-end-call" onclick="hangUpCall()">ဖုန်းချမည်</button>
    `;
  }

  function hangUpCall(notifyRemote = true) {
    if (notifyRemote && currentCallDocId) {
      db.collection("calls").doc(currentCallDocId).update({ status: "ended" });
    }

    if (localStream) localStream.getTracks().forEach(track => track.stop());
    if (peerConnection) peerConnection.close();

    localStream = null;
    remoteStream = null;
    peerConnection = null;
    currentCallDocId = null;

    document.getElementById('callOverlay').classList.add('hidden');
  }
</script>
</body>
  </html>
