<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Enhanced WebRTC & Chat App</title>

  <!-- Firebase Web SDK (Compat Engine) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: #121212; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
    
    .app-card { background: #1e1e1e; width: 100vw; height: 100vh; display: flex; flex-direction: column; overflow: hidden; position: relative; }
    @media (min-width: 480px) {
      .app-card { width: 420px; height: 92vh; border-radius: 20px; border: 1px solid #333; }
    }
    
    .hidden { display: none !important; }

    /* Fixed Native Top Notification (ဖုန်း၏ အထက်ဘက် အပေါ်ဆုံးမှ ကျလာမည့် စနစ်) */
    .top-notification { 
      position: fixed; 
      top: 10px; 
      left: 5%; 
      right: 5%; 
      background: rgba(30, 30, 30, 0.95); 
      border: 1px solid #0a84ff; 
      border-radius: 12px; 
      padding: 12px; 
      z-index: 99999; 
      box-shadow: 0 5px 15px rgba(0,0,0,0.6); 
      display: flex; 
      flex-direction: column; 
      gap: 4px; 
      transform: translateY(-150%); 
      transition: transform 0.3s ease; 
      backdrop-filter: blur(8px); 
    }
    .top-notification.show { transform: translateY(0); }
    .notif-title { font-size: 11px; color: #0a84ff; font-weight: bold; }
    .notif-body { font-size: 13px; color: #fff; }

    /* Auth Styling */
    .auth-box { padding: 30px 20px; display: flex; flex-direction: column; gap: 15px; justify-content: center; height: 100%; text-align: center; }
    .input-dark { padding: 14px; background: #2a2a2a; border: 1px solid #444; border-radius: 10px; color: white; font-size: 14px; width: 100%; outline: none; }
    .btn-main { background: #0a84ff; color: white; padding: 14px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 14px; }
    
    /* App Layout */
    .app-header { background: #252525; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; }
    .header-user { font-size: 13px; font-weight: 600; color: #0a84ff; max-width: 60%; overflow: hidden; text-overflow: ellipsis; }
    .btn-logout { background: #ff453a; color: white; border: none; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; }

    .tab-bar { display: flex; background: #252525; border-top: 1px solid #333; }
    .tab-btn { flex: 1; padding: 12px; text-align: center; background: none; border: none; color: #8e8e93; font-weight: 600; font-size: 13px; cursor: pointer; }
    .tab-btn.active { color: #0a84ff; border-top: 2px solid #0a84ff; }

    .section-container { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .contact-add-bar { padding: 10px; background: #2a2a2a; display: flex; gap: 6px; border-bottom: 1px solid #333; }
    .contact-list { flex: 1; overflow-y: auto; padding: 10px; }
    .contact-card { background: #2c2c2e; padding: 12px; border-radius: 10px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; border: 1px solid #3a3a3c; }

    /* Chat Section */
    .chat-header { background: #1c1c1e; padding: 10px 14px; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; }
    .call-btn-group { display: flex; gap: 8px; }
    .btn-call { border: none; padding: 8px 12px; border-radius: 8px; font-weight: bold; font-size: 12px; color: white; cursor: pointer; }
    .btn-voice { background: #30d158; }
    .btn-video { background: #5e5ce6; }

    /* Messages & Tick Statuses */
    .chat-box { flex: 1; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background: #141414; }
    .msg { padding: 10px 12px; border-radius: 14px; font-size: 13px; max-width: 78%; word-break: break-word; position: relative; display: flex; flex-direction: column; }
    .msg.me { background: #0a84ff; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
    .msg.them { background: #2c2c2e; color: white; align-self: flex-start; border-bottom-left-radius: 2px; }
    
    .msg-meta { display: flex; align-items: center; justify-content: flex-end; gap: 4px; font-size: 10px; color: rgba(255, 255, 255, 0.7); margin-top: 4px; align-self: flex-end; }
    .tick-icon { font-size: 11px; font-weight: bold; letter-spacing: -2px; }
    .tick-seen { color: #30d158; } /* Read status (Green Ticks) */

    .input-bar { padding: 10px; background: #1c1c1e; border-top: 1px solid #333; display: flex; gap: 8px; }
    .input-bar textarea { flex: 1; padding: 10px; background: #2c2c2e; border: 1px solid #3a3a3c; border-radius: 8px; color: white; font-size: 13px; resize: none; height: 40px; outline: none; }
    .btn-send { background: #0a84ff; color: white; border: none; padding: 0 16px; border-radius: 8px; font-weight: bold; cursor: pointer; }

    /* Call Screen Overlay */
    .call-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; color: white; display: flex; flex-direction: column; justify-content: space-between; align-items: center; z-index: 1000; overflow: hidden; }
    
    .call-info-header { position: absolute; top: 20px; z-index: 10; text-align: center; width: 100%; background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 100%); padding-bottom: 20px; pointer-events: none; }
    .call-info-header h4 { font-size: 16px; font-weight: 600; margin-bottom: 2px; }
    .call-info-header p { font-size: 12px; color: #30d158; }

    /* Video Frame Position */
    .video-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; display: flex; justify-content: center; align-items: center; }
    
    #remoteVideo { width: 100%; height: 100%; object-fit: contain; background: #050505; }
    #localVideo { position: absolute; top: 70px; right: 14px; width: 95px; height: 140px; object-fit: cover; border-radius: 10px; border: 1.5px solid rgba(255,255,255,0.5); background: #2c2c2e; box-shadow: 0 6px 16px rgba(0,0,0,0.6); z-index: 5; }
    
    /* Auto-Hiding Call Control Panel */
    .call-controls-panel { position: absolute; bottom: 24px; z-index: 20; width: 86%; background: rgba(20, 20, 20, 0.85); backdrop-filter: blur(16px); padding: 12px 16px; border-radius: 20px; display: flex; flex-direction: column; gap: 10px; border: 1px solid rgba(255,255,255,0.12); transition: opacity 0.4s ease, transform 0.4s ease; }
    .call-controls-panel.fade-out { opacity: 0; transform: translateY(20px); pointer-events: none; }

    .volume-slider-row { display: flex; align-items: center; gap: 10px; width: 100%; }
    .volume-slider-row input[type="range"] { flex: 1; accent-color: #0a84ff; height: 3px; }

    .action-buttons-row { display: flex; justify-content: space-around; align-items: center; width: 100%; }
    
    .btn-round { width: 44px; height: 44px; border-radius: 50%; border: none; color: white; font-size: 15px; display: flex; justify-content: center; align-items: center; cursor: pointer; transition: transform 0.1s; }
    .btn-round:active { transform: scale(0.92); }
    .btn-round.grey { background: rgba(255,255,255,0.22); }
    .btn-round.grey.active { background: #ff9500; }
    .btn-round.green { background: #30d158; width: 52px; height: 52px; font-size: 18px; }
    .btn-round.red { background: #ff453a; width: 52px; height: 52px; font-size: 18px; }
  </style>
</head>
<body onclick="resetControlHideTimer()">

<div class="app-card" id="appCard">
  
  <!-- Dynamic Top Notification Bar -->
  <div id="topNotif" class="top-notification">
    <div class="notif-title" id="notifSender">Message</div>
    <div class="notif-body" id="notifBody">...</div>
  </div>

  <!-- 1. Auth Section -->
  <div id="authSection" class="auth-box">
    <h2 style="color: #0a84ff;">အကောင့်ဝင်ရောက်ရန်</h2>
    <input type="email" id="emailInput" class="input-dark" placeholder="အီးမေးလ် ထည့်ပါ">
    <input type="password" id="passInput" class="input-dark" placeholder="စကားဝှက် ထည့်ပါ">
    <button class="btn-main" onclick="loginWithEmail()">အကောင့်ဝင်မည် / အကောင့်သစ်ဖွင့်မည်</button>
  </div>

  <!-- 2. Main App Section -->
  <div id="appSection" class="hidden" style="display: flex; flex-direction: column; height: 100%;">
    
    <div class="app-header">
      <div class="header-user" id="userNameDisplay">...</div>
      <button class="btn-logout" onclick="confirmLogout()">ထွက်မည်</button>
    </div>

    <!-- Contacts Tab -->
    <div id="contactsTab" class="section-container">
      <div class="contact-add-bar">
        <input type="email" id="newContactEmail" class="input-dark" placeholder="အသစ်ထည့်မည့် Email..." style="font-size: 12px; padding: 8px;">
        <button class="btn-main" onclick="saveContact()" style="padding: 8px 12px; font-size: 12px; white-space: nowrap;">Contact သိမ်းမည်</button>
      </div>
      <div class="contact-list" id="contactListContainer"></div>
    </div>

    <!-- Chat Tab -->
    <div id="chatTab" class="section-container hidden">
      <div class="chat-header">
        <div style="font-size: 13px; font-weight: bold;" id="selectedChatUserName">အကောင့် ရွေးချယ်မထားပါ</div>
        <div class="call-btn-group">
          <button class="btn-call btn-voice" onclick="startCall('audio')">📞 Voice</button>
          <button class="btn-call btn-video" onclick="startCall('video')">📹 Video</button>
        </div>
      </div>
      
      <div class="chat-box" id="chatBox">
        <div style="text-align: center; color: #8e8e93; font-size: 12px; margin-top: 20px;" id="chatPlaceholder">
          Contacts Tab မှ စကားပြောလိုသည့် အကောင့်ကို နှိပ်ပြီး ရွေးချယ်ပါ။
        </div>
      </div>

      <div class="input-bar">
        <textarea id="msgInput" placeholder="စာရိုက်ပါ..."></textarea>
        <button class="btn-send" onclick="sendMessage()">ပို့မည်</button>
      </div>
    </div>

    <!-- Navigation Tabs -->
    <div class="tab-bar">
      <button class="tab-btn active" id="btnTabContacts" onclick="switchTab('contacts')">👥 အဆက်အသွယ်များ</button>
      <button class="tab-btn" id="btnTabChat" onclick="switchTab('chat')">💬 စကားပြောရန်</button>
    </div>

  </div>

  <!-- 3. Full-Screen Call Overlay -->
  <div id="callOverlay" class="call-overlay hidden" onclick="toggleCallControls(event)">
    <div class="call-info-header">
      <h4 id="callUserTitle">User Email</h4>
      <p id="callStatusText">ဖုန်းခေါ်ဆိုနေပါသည်...</p>
    </div>

    <div class="video-container" id="videoContainer">
      <video id="remoteVideo" autoplay playsinline></video>
      <video id="localVideo" autoplay playsinline muted></video>
    </div>

    <div class="call-controls-panel" id="controlsPanel" onclick="event.stopPropagation()">
      <div class="volume-slider-row">
        <span style="font-size: 11px; color: #8e8e93;">📁</span>
        <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="1" oninput="changeRemoteVolume(this.value)">
        <span style="font-size: 12px;">🔊</span>
      </div>

      <div class="action-buttons-row">
        <button class="btn-round grey" id="btnMuteMic" onclick="toggleMuteMic()">🎤</button>
        <button class="btn-round grey" id="btnMuteSpeaker" onclick="toggleMuteSpeaker()">🔊</button>
        <button class="btn-round green" id="btnAnswerCall" onclick="answerCall()">📞</button>
        <button class="btn-round red" onclick="hangUpCall(true)">🛑</button>
      </div>
    </div>
  </div>

</div>

<script>
  // Firebase Configuration
  const firebaseConfig = {
    apiKey: "AIzaSyCxM61dhkI992k0SZZQNRimqEIp5DM4PaE",
    authDomain: "phone-call-bcb5d.firebaseapp.com",
    projectId: "phone-call-bcb5d",
    storageBucket: "phone-call-bcb5d.firebasestorage.app",
    messagingSenderId: "479656547247",
    appId: "1:479656547247:web:d6ae8a8903282e3856955a"
  };

  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  let currentUser = null;
  let selectedUser = null;
  let chatUnsubscribe = null;
  let callUnsubscribe = null;

  // WebRTC Variables
  let localStream = null;
  let remoteStream = null;
  let peerConnection = null;
  let currentCallDocId = null;

  let flashInterval = null;
  let flashStreamTrack = null;
  let audioCtx = null;
  let ringtoneOscillator = null;
  let hideControlsTimeout = null;

  const rtcServers = {
    iceServers: [{ urls: ['stun:stun1.l.google.com:19302', 'stun:stun2.l.google.com:19302'] }]
  };

  // Auth Handling
  auth.onAuthStateChanged(user => {
    if (user) {
      currentUser = user;
      document.getElementById('authSection').classList.add('hidden');
      document.getElementById('appSection').classList.remove('hidden');
      document.getElementById('userNameDisplay').innerText = user.email;

      db.collection("users").doc(user.uid).set({
        email: user.email.toLowerCase(),
        uid: user.uid
      }, { merge: true });

      loadContacts();
      listenIncomingCalls();
      listenGlobalNotifications();
    } else {
      document.getElementById('authSection').classList.remove('hidden');
      document.getElementById('appSection').classList.add('hidden');
    }
  });

  function loginWithEmail() {
    const email = document.getElementById('emailInput').value.trim();
    const pass = document.getElementById('passInput').value.trim();
    if(!email || !pass) return alert("Email နှင့် Password ထည့်ပါ");
    auth.signInWithEmailAndPassword(email, pass).catch(() => {
      auth.createUserWithEmailAndPassword(email, pass).catch(e => alert(e.message));
    });
  }

  function confirmLogout() {
    auth.signOut();
  }

  function switchTab(tab) {
    if (tab === 'contacts') {
      document.getElementById('contactsTab').classList.remove('hidden');
      document.getElementById('chatTab').classList.add('hidden');
      document.getElementById('btnTabContacts').classList.add('active');
      document.getElementById('btnTabChat').classList.remove('active');
    } else {
      document.getElementById('contactsTab').classList.add('hidden');
      document.getElementById('chatTab').classList.remove('hidden');
      document.getElementById('btnTabChat').classList.active && document.getElementById('btnTabChat').classList.add('active');
      document.getElementById('btnTabContacts').classList.remove('active');
    }
  }

  // --- Auto-Hiding Controls Logic ---
  function resetControlHideTimer() {
    const panel = document.getElementById('controlsPanel');
    if (!panel) return;
    panel.classList.remove('fade-out');

    if (hideControlsTimeout) clearTimeout(hideControlsTimeout);
    hideControlsTimeout = setTimeout(() => {
      const callOverlay = document.getElementById('callOverlay');
      if (!callOverlay.classList.contains('hidden')) {
        panel.classList.add('fade-out');
      }
    }, 4000);
  }

  function toggleCallControls(e) {
    const panel = document.getElementById('controlsPanel');
    if (panel.classList.contains('fade-out')) {
      resetControlHideTimer();
    } else {
      panel.classList.add('fade-out');
    }
  }

  // --- Hardware Flashlight ---
  async function startHardwareFlashlight() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
      flashStreamTrack = stream.getVideoTracks()[0];
      let state = false;
      flashInterval = setInterval(() => {
        state = !state;
        flashStreamTrack.applyConstraints({ advanced: [{ torch: state }] }).catch(() => {});
      }, 400);
    } catch (e) {}
  }

  function stopHardwareFlashlight() {
    if (flashInterval) { clearInterval(flashInterval); flashInterval = null; }
    if (flashStreamTrack) {
      flashStreamTrack.applyConstraints({ advanced: [{ torch: false }] }).catch(() => {});
      flashStreamTrack.stop();
      flashStreamTrack = null;
    }
  }

  function startRingtoneSound() {
    stopRingtoneSound();
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      ringtoneOscillator = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();
      ringtoneOscillator.type = 'sine';
      ringtoneOscillator.frequency.setValueAtTime(440, audioCtx.currentTime);
      ringtoneOscillator.connect(gainNode);
      gainNode.connect(audioCtx.destination);
      ringtoneOscillator.start();
    } catch(e){}
  }

  function stopRingtoneSound() {
    if (ringtoneOscillator) { try { ringtoneOscillator.stop(); } catch(e){} ringtoneOscillator = null; }
    if (audioCtx) { try { audioCtx.close(); } catch(e){} audioCtx = null; }
  }

  function toggleMuteMic() {
    if (!localStream) return;
    const audioTrack = localStream.getAudioTracks()[0];
    if (audioTrack) {
      audioTrack.enabled = !audioTrack.enabled;
      document.getElementById('btnMuteMic').classList.toggle('active', !audioTrack.enabled);
    }
    resetControlHideTimer();
  }

  function toggleMuteSpeaker() {
    const videoElem = document.getElementById('remoteVideo');
    videoElem.muted = !videoElem.muted;
    document.getElementById('btnMuteSpeaker').classList.toggle('active', videoElem.muted);
    resetControlHideTimer();
  }

  function changeRemoteVolume(val) {
    document.getElementById('remoteVideo').volume = val;
    resetControlHideTimer();
  }

  function saveContact() {
    const email = document.getElementById('newContactEmail').value.trim().toLowerCase();
    if (!email) return alert("Email ရိုက်ထည့်ပါ");
    if (email === currentUser.email) return alert("မိမိ Email ကို သိမ်း၍ မရပါ");

    db.collection("users").doc(currentUser.uid).collection("contacts").doc(email.replace(/[^a-zA-Z0-9]/g, "_")).set({
      email: email
    }).then(() => {
      alert("Contact သိမ်းဆည်းပြီးပါပြီ");
      document.getElementById('newContactEmail').value = '';
      loadContacts();
    });
  }

  function loadContacts() {
    db.collection("users").doc(currentUser.uid).collection("contacts").onSnapshot(snap => {
      const container = document.getElementById('contactListContainer');
      container.innerHTML = '';
      if (snap.empty) {
        container.innerHTML = `<div style="text-align:center; color:#8e8e93; font-size:12px; margin-top:20px;">Contact စာရင်း မရှိသေးပါ။ ထည့်သွင်းပါ။</div>`;
        return;
      }
      snap.forEach(doc => {
        const c = doc.data();
        const card = document.createElement('div');
        card.className = 'contact-card';
        card.innerHTML = `
          <div>
            <div style="font-weight:bold; font-size:14px;">${c.email.split('@')[0]}</div>
            <div style="font-size:11px; color:#8e8e93;">${c.email}</div>
          </div>
          <span style="color:#0a84ff; font-size:12px; font-weight:bold;">💬 Chat</span>
        `;
        card.onclick = () => selectUserToChat(c.email);
        container.appendChild(card);
      });
    });
  }

  async function selectUserToChat(email) {
    selectedUser = { email: email.toLowerCase() };
    document.getElementById('selectedChatUserName').innerText = selectedUser.email;
    document.getElementById('chatPlaceholder').classList.add('hidden');
    switchTab('chat');
    listenMessages();
  }

  // --- Email-Based Room ID Generator (အမြဲတမ်း စာပို့စနစ် မှန်ကန်စေမည့် အဆင့်) ---
  function getRoomId(email1, email2) {
    const clean1 = email1.toLowerCase().replace(/[^a-zA-Z0-9]/g, "_");
    const clean2 = email2.toLowerCase().replace(/[^a-zA-Z0-9]/g, "_");
    return clean1 < clean2 ? `${clean1}_${clean2}` : `${clean2}_${clean1}`;
  }

  // --- Real-Time Chat & Read Status (Ticks & Timestamp) Fix ---
  function listenMessages() {
    if (!selectedUser || !currentUser) return;
    if (chatUnsubscribe) chatUnsubscribe();

    const roomId = getRoomId(currentUser.email, selectedUser.email);
    
    chatUnsubscribe = db.collection("chats").doc(roomId).collection("messages").orderBy("timestamp", "asc")
      .onSnapshot(snap => {
        const box = document.getElementById('chatBox');
        box.innerHTML = '';
        snap.forEach(doc => {
          const m = doc.data();
          
          // အခြားသူ ပို့ထားသော စာအား ကြည့်ရှုပါက seen: true ပြောင်းမည်
          if (m.receiverEmail === currentUser.email.toLowerCase() && !m.seen) {
            doc.ref.update({ seen: true }).catch(() => {});
          }

          const timeStr = m.timestamp ? new Date(m.timestamp.toDate()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : 'နားနား';
          
          let tickStatus = '';
          if (m.senderEmail === currentUser.email.toLowerCase()) {
            tickStatus = m.seen ? `<span class="tick-icon tick-seen">✓✓</span>` : `<span class="tick-icon">✓</span>`;
          }

          const div = document.createElement('div');
          div.className = `msg ${m.senderEmail === currentUser.email.toLowerCase() ? 'me' : 'them'}`;
          div.innerHTML = `
            <div>${m.text}</div>
            <div class="msg-meta">
              <span>${timeStr}</span>
              ${tickStatus}
            </div>
          `;
          box.appendChild(div);
        });
        box.scrollTop = box.scrollHeight;
      });
  }

  function sendMessage() {
    if (!selectedUser) return alert("အဆက်အသွယ်များထဲမှ လူတစ်ဦးကို အရင်ရွေးချယ်ပါ");
    const input = document.getElementById('msgInput');
    const msgText = input.value.trim();
    if (!msgText) return;

    input.value = '';

    const roomId = getRoomId(currentUser.email, selectedUser.email);
    db.collection("chats").doc(roomId).collection("messages").add({
      text: msgText,
      senderEmail: currentUser.email.toLowerCase(),
      receiverEmail: selectedUser.email.toLowerCase(),
      seen: false,
      timestamp: firebase.firestore.FieldValue.serverTimestamp()
    }).catch(err => {
      alert("စာပို့ရာတွင် အမှားရှိပါသည်: " + err.message);
    });
  }

  function listenGlobalNotifications() {
    db.collectionGroup("messages").where("receiverEmail", "==", currentUser.email.toLowerCase())
      .onSnapshot(snap => {
        snap.docChanges().forEach(change => {
          if (change.type === "added") {
            const data = change.doc.data();
            showTopNotification(data.senderEmail, data.text);
          }
        });
      });
  }

  function showTopNotification(sender, text) {
    const notif = document.getElementById('topNotif');
    document.getElementById('notifSender').innerText = `Message from ${sender}`;
    document.getElementById('notifBody').innerText = text;
    notif.classList.add('show');
    startHardwareFlashlight();
    setTimeout(() => {
      notif.classList.remove('show');
      stopHardwareFlashlight();
    }, 3000);
  }

  // --- WebRTC Call Functions ---
  async function startCall(type) {
    if (!selectedUser) return alert("ဖုန်းခေါ်ဆိုရန် အဆက်အသွယ် ရွေးချယ်ပါ");

    const callDoc = db.collection("calls").doc();
    currentCallDocId = callDoc.id;

    document.getElementById('callOverlay').classList.remove('hidden');
    document.getElementById('callUserTitle').innerText = selectedUser.email;
    document.getElementById('callStatusText').innerText = "ဖုန်းခေါ်ဆိုနေပါသည်...";
    document.getElementById('btnAnswerCall').classList.add('hidden');

    resetControlHideTimer();
    startRingtoneSound();

    localStream = await navigator.mediaDevices.getUserMedia({ 
      video: type === 'video' ? { facingMode: 'user' } : false, 
      audio: true 
    });
    remoteStream = new MediaStream();

    document.getElementById('localVideo').srcObject = localStream;
    document.getElementById('remoteVideo').srcObject = remoteStream;

    if (type === 'audio') {
      document.getElementById('localVideo').classList.add('hidden');
    } else {
      document.getElementById('localVideo').classList.remove('hidden');
    }

    peerConnection = new RTCPeerConnection(rtcServers);
    localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

    peerConnection.ontrack = event => {
      event.streams[0].getTracks().forEach(track => remoteStream.addTrack(track));
    };

    const offerCandidates = callDoc.collection("offerCandidates");
    peerConnection.onicecandidate = event => {
      if (event.candidate) offerCandidates.add(event.candidate.toJSON());
    };

    const offerDescription = await peerConnection.createOffer();
    await peerConnection.setLocalDescription(offerDescription);

    await callDoc.set({
      offer: { type: offerDescription.type, sdp: offerDescription.sdp },
      callerEmail: currentUser.email.toLowerCase(),
      receiverEmail: selectedUser.email.toLowerCase(),
      callType: type,
      status: "calling"
    });

    callUnsubscribe = callDoc.onSnapshot(snapshot => {
      const data = snapshot.data();
      if (peerConnection && !peerConnection.currentRemoteDescription && data && data.answer) {
        stopRingtoneSound();
        const answerDescription = new RTCSessionDescription(data.answer);
        peerConnection.setRemoteDescription(answerDescription);
        document.getElementById('callStatusText').innerText = "စကားပြောနေပါသည်";
      }
      if (data && data.status === "ended") {
        hangUpCall(false);
      }
    });

    callDoc.collection("answerCandidates").onSnapshot(snapshot => {
      snapshot.docChanges().forEach(change => {
        if (change.type === "added") {
          peerConnection.addIceCandidate(new RTCIceCandidate(change.doc.data()));
        }
      });
    });
  }

  function listenIncomingCalls() {
    db.collection("calls").where("receiverEmail", "==", currentUser.email.toLowerCase()).where("status", "==", "calling")
      .onSnapshot(snapshot => {
        snapshot.docChanges().forEach(async change => {
          if (change.type === "added") {
            const data = change.doc.data();
            currentCallDocId = change.doc.id;

            document.getElementById('callOverlay').classList.remove('hidden');
            document.getElementById('btnAnswerCall').classList.remove('hidden');
            document.getElementById('callUserTitle').innerText = data.callerEmail;
            document.getElementById('callStatusText').innerText = `${data.callType === 'video' ? 'Video' : 'Audio'} Call ဝင်လာပါသည်...`;

            resetControlHideTimer();
            startHardwareFlashlight();
            startRingtoneSound();

            callUnsubscribe = db.collection("calls").doc(currentCallDocId).onSnapshot(docSnap => {
              if (docSnap.exists && docSnap.data().status === "ended") {
                hangUpCall(false);
              }
            });
          }
        });
      });
  }

  async function answerCall() {
    stopHardwareFlashlight();
    stopRingtoneSound();
    
    document.getElementById('btnAnswerCall').classList.add('hidden');

    const callDoc = db.collection("calls").doc(currentCallDocId);
    const callData = (await callDoc.get()).data();
    
    localStream = await navigator.mediaDevices.getUserMedia({ 
      video: callData.callType === 'video' ? { facingMode: 'user' } : false, 
      audio: true 
    });
    remoteStream = new MediaStream();

    document.getElementById('localVideo').srcObject = localStream;
    document.getElementById('remoteVideo').srcObject = remoteStream;

    if (callData.callType === 'audio') {
      document.getElementById('localVideo').classList.add('hidden');
    } else {
      document.getElementById('localVideo').classList.remove('hidden');
    }

    peerConnection = new RTCPeerConnection(rtcServers);
    localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

    peerConnection.ontrack = event => {
      event.streams[0].getTracks().forEach(track => remoteStream.addTrack(track));
    };

    const answerCandidates = callDoc.collection("answerCandidates");
    peerConnection.onicecandidate = event => {
      if (event.candidate) answerCandidates.add(event.candidate.toJSON());
    };

    await peerConnection.setRemoteDescription(new RTCSessionDescription(callData.offer));

    const answerDescription = await peerConnection.createAnswer();
    await peerConnection.setLocalDescription(answerDescription);

    await callDoc.update({
      answer: { type: answerDescription.type, sdp: answerDescription.sdp },
      status: "connected"
    });

    callDoc.collection("offerCandidates").onSnapshot(snapshot => {
      snapshot.docChanges().forEach(change => {
        if (change.type === "added") {
          peerConnection.addIceCandidate(new RTCIceCandidate(change.doc.data()));
        }
      });
    });

    document.getElementById('callStatusText').innerText = "စကားပြောနေပါသည်";
    resetControlHideTimer();
  }

  function hangUpCall(notifyRemote = true) {
    stopHardwareFlashlight();
    stopRingtoneSound();

    if (notifyRemote && currentCallDocId) {
      db.collection("calls").doc(currentCallDocId).update({ status: "ended" });
    }

    if (callUnsubscribe) callUnsubscribe();

    if (localStream) {
      localStream.getTracks().forEach(track => track.stop());
    }
    
    if (peerConnection) peerConnection.close();

    localStream = null;
    remoteStream = null;
    peerConnection = null;
    currentCallDocId = null;

    if (hideControlsTimeout) clearTimeout(hideControlsTimeout);

    document.getElementById('callOverlay').classList.add('hidden');
  }
</script>
