<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Fast Native-Like WebRTC & Chat</title>

  <!-- Firebase Web SDK (Compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: #121212; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
    
    .app-card { background: #1e1e1e; width: 100vw; height: 100vh; display: flex; flex-direction: column; overflow: hidden; position: relative; }
    @media (min-width: 480px) {
      .app-card { width: 420px; height: 92vh; border-radius: 20px; border: 1px solid #333; }
    }
    
    .hidden { display: none !important; }

    /* Fixed Native Top Notification (အပေါ်ဆုံးမှ ကျလာမည့် စနစ်) */
    .top-notification { 
      position: fixed; 
      top: 12px; 
      left: 12px; 
      right: 12px; 
      background: rgba(30, 30, 30, 0.95); 
      border: 1px solid #0a84ff; 
      border-radius: 14px; 
      padding: 12px 16px; 
      z-index: 9999; 
      box-shadow: 0 8px 24px rgba(0,0,0,0.6); 
      display: flex; 
      flex-direction: column; 
      gap: 3px; 
      transform: translateY(-150%); 
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
      backdrop-filter: blur(10px); 
    }
    .top-notification.show { transform: translateY(0); }
    .notif-title { font-size: 11px; color: #0a84ff; font-weight: bold; text-transform: uppercase; }
    .notif-body { font-size: 13px; color: #fff; font-weight: 500; }

    /* Auth Box */
    .auth-box { padding: 30px 20px; display: flex; flex-direction: column; gap: 15px; justify-content: center; height: 100%; text-align: center; }
    .input-dark { padding: 14px; background: #2a2a2a; border: 1px solid #444; border-radius: 10px; color: white; font-size: 14px; width: 100%; outline: none; }
    .btn-main { background: #0a84ff; color: white; padding: 14px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 14px; }
    
    /* Header */
    .app-header { background: #252525; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; }
    .header-user { font-size: 13px; font-weight: 600; color: #0a84ff; max-width: 65%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .btn-logout { background: #ff453a; color: white; border: none; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; }

    /* Tab Navigation */
    .tab-bar { display: flex; background: #252525; border-top: 1px solid #333; }
    .tab-btn { flex: 1; padding: 14px; text-align: center; background: none; border: none; color: #8e8e93; font-weight: 600; font-size: 13px; cursor: pointer; }
    .tab-btn.active { color: #0a84ff; border-top: 2px solid #0a84ff; }

    .section-container { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .contact-add-bar { padding: 10px; background: #2a2a2a; display: flex; gap: 6px; border-bottom: 1px solid #333; }
    .contact-list { flex: 1; overflow-y: auto; padding: 10px; }
    .contact-card { background: #2c2c2e; padding: 12px; border-radius: 10px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }

    /* Optimized Chat Interface */
    .chat-header { background: #1c1c1e; padding: 10px 14px; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; }
    .call-btn-group { display: flex; gap: 8px; }
    .btn-call { border: none; padding: 8px 12px; border-radius: 8px; font-weight: bold; font-size: 12px; color: white; cursor: pointer; }
    .btn-voice { background: #30d158; }
    .btn-video { background: #5e5ce6; }

    .chat-box { flex: 1; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background: #141414; }
    .msg { padding: 8px 12px; border-radius: 14px; font-size: 14px; max-width: 75%; word-break: break-word; position: relative; display: flex; flex-direction: column; }
    .msg.me { background: #0a84ff; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
    .msg.them { background: #2c2c2e; color: white; align-self: flex-start; border-bottom-left-radius: 2px; }
    
    /* Double Ticks & Meta Info */
    .msg-meta { display: flex; align-items: center; justify-content: flex-end; gap: 3px; font-size: 10px; color: rgba(255, 255, 255, 0.7); margin-top: 2px; align-self: flex-end; }
    .tick-icon { font-size: 11px; font-weight: bold; letter-spacing: -2px; }
    .tick-seen { color: #30d158; }

    .input-bar { padding: 8px 10px; background: #1c1c1e; border-top: 1px solid #333; display: flex; gap: 8px; align-items: center; }
    .input-bar input { flex: 1; padding: 10px 12px; background: #2c2c2e; border: 1px solid #3a3a3c; border-radius: 20px; color: white; font-size: 14px; outline: none; }
    .btn-send { background: #0a84ff; color: white; border: none; padding: 10px 16px; border-radius: 20px; font-weight: bold; cursor: pointer; }

    /* WebRTC Video Call Overlay (Compact & Perfect Camera View) */
    .call-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; color: white; display: flex; flex-direction: column; justify-content: space-between; align-items: center; z-index: 1000; overflow: hidden; }
    .call-info-header { position: absolute; top: 20px; z-index: 10; text-align: center; width: 100%; background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 100%); padding-bottom: 20px; }
    .video-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; display: flex; justify-content: center; align-items: center; }
    
    #remoteVideo { width: 100%; height: 100%; object-fit: contain; }
    #localVideo { position: absolute; top: 70px; right: 14px; width: 90px; height: 135px; object-fit: cover; border-radius: 10px; border: 1.5px solid rgba(255,255,255,0.5); z-index: 5; }
    
    .call-controls-panel { position: absolute; bottom: 24px; z-index: 20; width: 86%; background: rgba(20, 20, 20, 0.85); backdrop-filter: blur(16px); padding: 12px 16px; border-radius: 20px; display: flex; flex-direction: column; gap: 10px; border: 1px solid rgba(255,255,255,0.12); transition: opacity 0.3s ease; }
    .call-controls-panel.fade-out { opacity: 0; pointer-events: none; }

    .action-buttons-row { display: flex; justify-content: space-around; align-items: center; width: 100%; }
    .btn-round { width: 44px; height: 44px; border-radius: 50%; border: none; color: white; font-size: 15px; display: flex; justify-content: center; align-items: center; cursor: pointer; }
    .btn-round.grey { background: rgba(255,255,255,0.2); }
    .btn-round.green { background: #30d158; width: 50px; height: 50px; }
    .btn-round.red { background: #ff453a; width: 50px; height: 50px; }
  </style>
</head>
<body onclick="resetControlHideTimer()">

<div class="app-card">
  
  <!-- Top Fixed Notification Box -->
  <div id="topNotif" class="top-notification">
    <div class="notif-title" id="notifSender">Message</div>
    <div class="notif-body" id="notifBody">...</div>
  </div>

  <!-- 1. Auth Box -->
  <div id="authSection" class="auth-box">
    <h2 style="color: #0a84ff;">အကောင့်ဝင်ပါ</h2>
    <input type="email" id="emailInput" class="input-dark" placeholder="အီးမေးလ် ထည့်ပါ">
    <input type="password" id="passInput" class="input-dark" placeholder="စကားဝှက် ထည့်ပါ">
    <button class="btn-main" onclick="loginWithEmail()">အကောင့်ဝင်မည် / အကောင့်သစ်ဖွင့်မည်</button>
  </div>

  <!-- 2. App Content -->
  <div id="appSection" class="hidden" style="display: flex; flex-direction: column; height: 100%;">
    
    <div class="app-header">
      <div class="header-user" id="userNameDisplay">...</div>
      <button class="btn-logout" onclick="auth.signOut()">ထွက်မည်</button>
    </div>

    <!-- Contacts List -->
    <div id="contactsTab" class="section-container">
      <div class="contact-add-bar">
        <input type="email" id="newContactEmail" class="input-dark" placeholder="Email အသစ်..." style="font-size: 12px; padding: 8px;">
        <button class="btn-main" onclick="saveContact()" style="padding: 8px 12px; font-size: 12px;">သိမ်းမည်</button>
      </div>
      <div class="contact-list" id="contactListContainer"></div>
    </div>

    <!-- Chat Interface -->
    <div id="chatTab" class="section-container hidden">
      <div class="chat-header">
        <div style="font-size: 13px; font-weight: bold;" id="selectedChatUserName">အကောင့် မရွေးရသေးပါ</div>
        <div class="call-btn-group">
          <button class="btn-call btn-voice" onclick="startCall('audio')">📞 Voice</button>
          <button class="btn-call btn-video" onclick="startCall('video')">📹 Video</button>
        </div>
      </div>
      
      <div class="chat-box" id="chatBox"></div>

      <div class="input-bar">
        <input type="text" id="msgInput" placeholder="စာရိုက်ပါ..." onkeydown="if(event.key==='Enter') sendMessage()">
        <button class="btn-send" onclick="sendMessage()">ပို့မည်</button>
      </div>
    </div>

    <!-- Navigation Bar -->
    <div class="tab-bar">
      <button class="tab-btn active" id="btnTabContacts" onclick="switchTab('contacts')">👥 အဆက်အသွယ်</button>
      <button class="tab-btn" id="btnTabChat" onclick="switchTab('chat')">💬 စကားပြောရန်</button>
    </div>

  </div>

  <!-- 3. WebRTC Overlay -->
  <div id="callOverlay" class="call-overlay hidden" onclick="toggleCallControls()">
    <div class="call-info-header">
      <h4 id="callUserTitle">User Email</h4>
      <p id="callStatusText" style="font-size: 12px; color: #30d158;">ခေါ်ဆိုနေပါသည်...</p>
    </div>

    <div class="video-container">
      <video id="remoteVideo" autoplay playsinline></video>
      <video id="localVideo" autoplay playsinline muted></video>
    </div>

    <div class="call-controls-panel" id="controlsPanel" onclick="event.stopPropagation()">
      <div class="action-buttons-row">
        <button class="btn-round grey" onclick="toggleMuteMic()">🎤</button>
        <button class="btn-round green" id="btnAnswerCall" onclick="answerCall()">📞</button>
        <button class="btn-round red" onclick="hangUpCall(true)">🛑</button>
      </div>
    </div>
  </div>

</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyCxM61dhkI992k0SZZQNRimqEIp5DM4PaE",
    authDomain: "phone-call-bcb5d.firebaseapp.com",
    projectId: "phone-call-bcb5d",
    storageBucket: "phone-call-bcb5d.firebasestorage.app",
    messagingSenderId: "479656547247",
    appId: "1:479656547247:web:d6ae8a8903282e3856955a"
  };

  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  // Firestore Speed Offline Mode (Fast Performance for Mobile Apps)
  db.enablePersistence({ synchronizeTabs: true }).catch(() => {});

  let currentUser = null;
  let selectedUser = null;
  let chatUnsubscribe = null;
  
  let localStream = null;
  let remoteStream = null;
  let peerConnection = null;
  let currentCallDocId = null;
  let hideControlsTimeout = null;

  const rtcServers = {
    iceServers: [{ urls: ['stun:stun1.l.google.com:19302', 'stun:stun2.l.google.com:19302'] }]
  };

  auth.onAuthStateChanged(user => {
    if (user) {
      currentUser = user;
      document.getElementById('authSection').classList.add('hidden');
      document.getElementById('appSection').classList.remove('hidden');
      document.getElementById('userNameDisplay').innerText = user.email;

      db.collection("users").doc(user.uid).set({
        email: user.email.toLowerCase(),
        uid: user.uid
      }, { merge: true });

      loadContacts();
      listenIncomingCalls();
    } else {
      document.getElementById('authSection').classList.remove('hidden');
      document.getElementById('appSection').classList.add('hidden');
    }
  });

  function loginWithEmail() {
    const email = document.getElementById('emailInput').value.trim();
    const pass = document.getElementById('passInput').value.trim();
    if(!email || !pass) return alert("Email/Password ထည့်ပါ");
    auth.signInWithEmailAndPassword(email, pass).catch(() => {
      auth.createUserWithEmailAndPassword(email, pass).catch(e => alert(e.message));
    });
  }

  function switchTab(tab) {
    if (tab === 'contacts') {
      document.getElementById('contactsTab').classList.remove('hidden');
      document.getElementById('chatTab').classList.add('hidden');
      document.getElementById('btnTabContacts').classList.add('active');
      document.getElementById('btnTabChat').classList.remove('active');
    } else {
      document.getElementById('contactsTab').classList.add('hidden');
      document.getElementById('chatTab').classList.remove('hidden');
      document.getElementById('btnTabChat').classList.add('active');
      document.getElementById('btnTabContacts').classList.remove('active');
    }
  }

  function saveContact() {
    const email = document.getElementById('newContactEmail').value.trim().toLowerCase();
    if (!email || email === currentUser.email) return;

    db.collection("users").doc(currentUser.uid).collection("contacts").doc(email.replace(/[^a-zA-Z0-9]/g, "_")).set({ email })
      .then(() => {
        document.getElementById('newContactEmail').value = '';
        loadContacts();
      });
  }

  function loadContacts() {
    db.collection("users").doc(currentUser.uid).collection("contacts").onSnapshot(snap => {
      const container = document.getElementById('contactListContainer');
      container.innerHTML = '';
      snap.forEach(doc => {
        const c = doc.data();
        const card = document.createElement('div');
        card.className = 'contact-card';
        card.innerHTML = `<div><b>${c.email.split('@')[0]}</b><br><small style="color:#8e8e93">${c.email}</small></div><span style="color:#0a84ff;">💬</span>`;
        card.onclick = () => selectUserToChat(c.email);
        container.appendChild(card);
      });
    });
  }

  async function selectUserToChat(email) {
    const snap = await db.collection("users").where("email", "==", email).get();
    if (!snap.empty) {
      snap.forEach(doc => selectedUser = doc.data());
    } else {
      const cleanUid = "user_" + email.replace(/[^a-zA-Z0-9]/g, "_");
      selectedUser = { uid: cleanUid, email: email };
    }
    
    document.getElementById('selectedChatUserName').innerText = selectedUser.email;
    switchTab('chat');
    listenMessages();
  }

  // --- Real-time Fast Sync Chat & Double Ticks System ---
  function listenMessages() {
    if (!selectedUser || !currentUser) return;
    if (chatUnsubscribe) chatUnsubscribe();

    const roomId = currentUser.uid < selectedUser.uid ? `${currentUser.uid}_${selectedUser.uid}` : `${selectedUser.uid}_${currentUser.uid}`;
    
    chatUnsubscribe = db.collection("chats").doc(roomId).collection("messages").orderBy("timestamp", "asc")
      .onSnapshot(snap => {
        const box = document.getElementById('chatBox');
        box.innerHTML = '';
        
        snap.forEach(doc => {
          const m = doc.data();
          
          // အခြားသူ ပို့ထားသော စာများအား ဖတ်ပြီးပါက seen: true သို့ ပြောင်းလဲခြင်း
          if (m.receiverUid === currentUser.uid && !m.seen) {
            doc.ref.update({ seen: true }).catch(() => {});
          }

          const timeStr = m.timestamp ? new Date(m.timestamp.toDate()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '...';
          
          let tickStatus = '';
          if (m.senderUid === currentUser.uid) {
            tickStatus = m.seen ? `<span class="tick-icon tick-seen">✓✓</span>` : `<span class="tick-icon">✓</span>`;
          }

          const div = document.createElement('div');
          div.className = `msg ${m.senderUid === currentUser.uid ? 'me' : 'them'}`;
          div.innerHTML = `
            <div>${m.text}</div>
            <div class="msg-meta">
              <span>${timeStr}</span>
              ${tickStatus}
            </div>
          `;
          box.appendChild(div);
        });
        box.scrollTop = box.scrollHeight;
      });
  }

  function sendMessage() {
    if (!selectedUser) return alert("Contact အရင်ရွေးပါ");
    const input = document.getElementById('msgInput');
    const text = input.value.trim();
    if (!text) return;

    input.value = '';

    const roomId = currentUser.uid < selectedUser.uid ? `${currentUser.uid}_${selectedUser.uid}` : `${selectedUser.uid}_${currentUser.uid}`;
    
    db.collection("chats").doc(roomId).collection("messages").add({
      text: text,
      senderUid: currentUser.uid,
      senderEmail: currentUser.email,
      receiverUid: selectedUser.uid,
      seen: false,
      timestamp: firebase.firestore.FieldValue.serverTimestamp()
    }).then(() => {
      showTopNotification("Sent", text);
    }).catch(e => alert("စာပို့ရာတွင် အမှားရှိပါသည်: " + e.message));
  }

  function showTopNotification(sender, text) {
    const notif = document.getElementById('topNotif');
    document.getElementById('notifSender').innerText = sender;
    document.getElementById('notifBody').innerText = text;
    notif.classList.add('show');
    setTimeout(() => notif.classList.remove('show'), 2500);
  }

  // --- WebRTC Functions ---
  async function startCall(type) {
    if (!selectedUser) return alert("Contact အရင်ရွေးပါ");
    const callDoc = db.collection("calls").doc();
    currentCallDocId = callDoc.id;

    document.getElementById('callOverlay').classList.remove('hidden');
    document.getElementById('callUserTitle').innerText = selectedUser.email;
    document.getElementById('btnAnswerCall').classList.add('hidden');

    localStream = await navigator.mediaDevices.getUserMedia({ video: type === 'video', audio: true });
    remoteStream = new MediaStream();

    document.getElementById('localVideo').srcObject = localStream;
    document.getElementById('remoteVideo').srcObject = remoteStream;

    peerConnection = new RTCPeerConnection(rtcServers);
    localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
    peerConnection.ontrack = event => event.streams[0].getTracks().forEach(track => remoteStream.addTrack(track));

    const offerCandidates = callDoc.collection("offerCandidates");
    peerConnection.onicecandidate = event => event.candidate && offerCandidates.add(event.candidate.toJSON());

    const offerDescription = await peerConnection.createOffer();
    await peerConnection.setLocalDescription(offerDescription);

    await callDoc.set({
      offer: { type: offerDescription.type, sdp: offerDescription.sdp },
      callerEmail: currentUser.email,
      receiverUid: selectedUser.uid,
      status: "calling"
    });

    callDoc.onSnapshot(snapshot => {
      const data = snapshot.data();
      if (peerConnection && !peerConnection.currentRemoteDescription && data && data.answer) {
        peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
        document.getElementById('callStatusText').innerText = "စကားပြောနေပါသည်";
      }
      if (data && data.status === "ended") hangUpCall(false);
    });

    callDoc.collection("answerCandidates").onSnapshot(snap => {
      snap.docChanges().forEach(change => change.type === "added" && peerConnection.addIceCandidate(new RTCIceCandidate(change.doc.data())));
    });
  }

  function listenIncomingCalls() {
    db.collection("calls").where("receiverUid", "==", currentUser.uid).where("status", "==", "calling")
      .onSnapshot(snap => {
        snap.docChanges().forEach(change => {
          if (change.type === "added") {
            const data = change.doc.data();
            currentCallDocId = change.doc.id;
            document.getElementById('callOverlay').classList.remove('hidden');
            document.getElementById('btnAnswerCall').classList.remove('hidden');
            document.getElementById('callUserTitle').innerText = data.callerEmail;
          }
        });
      });
  }

  async function answerCall() {
    document.getElementById('btnAnswerCall').classList.add('hidden');
    const callDoc = db.collection("calls").doc(currentCallDocId);
    
    localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
    remoteStream = new MediaStream();

    document.getElementById('localVideo').srcObject = localStream;
    document.getElementById('remoteVideo').srcObject = remoteStream;

    peerConnection = new RTCPeerConnection(rtcServers);
    localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
    peerConnection.ontrack = event => event.streams[0].getTracks().forEach(track => remoteStream.addTrack(track));

    const answerCandidates = callDoc.collection("answerCandidates");
    peerConnection.onicecandidate = event => event.candidate && answerCandidates.add(event.candidate.toJSON());

    const callData = (await callDoc.get()).data();
    await peerConnection.setRemoteDescription(new RTCSessionDescription(callData.offer));

    const answerDescription = await peerConnection.createAnswer();
    await peerConnection.setLocalDescription(answerDescription);

    await callDoc.update({ answer: { type: answerDescription.type, sdp: answerDescription.sdp }, status: "connected" });

    callDoc.collection("offerCandidates").onSnapshot(snap => {
      snap.docChanges().forEach(change => change.type === "added" && peerConnection.addIceCandidate(new RTCIceCandidate(change.doc.data())));
    });
  }

  function hangUpCall(notify = true) {
    if (notify && currentCallDocId) db.collection("calls").doc(currentCallDocId).update({ status: "ended" });
    if (localStream) localStream.getTracks().forEach(track => track.stop());
    if (peerConnection) peerConnection.close();
    document.getElementById('callOverlay').classList.add('hidden');
  }

  function resetControlHideTimer() {
    const panel = document.getElementById('controlsPanel');
    panel.classList.remove('fade-out');
    if (hideControlsTimeout) clearTimeout(hideControlsTimeout);
    hideControlsTimeout = setTimeout(() => panel.classList.add('fade-out'), 4000);
  }

  function toggleCallControls() {
    document.getElementById('controlsPanel').classList.toggle('fade-out');
  }

  function toggleMuteMic() {
    if (localStream) {
      const track = localStream.getAudioTracks()[0];
      if (track) track.enabled = !track.enabled;
    }
  }
</script>
</body>
</html>
