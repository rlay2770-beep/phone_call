<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phone Call & Private Chat App</title>

  <!-- Firebase Web SDK v10.8.0 (Compat Mode) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-messaging-compat.js"></script>

  <!-- SendBird Calls / Chat SDK (If integrated) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sendbird/3.1.2/SendBird.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #eef2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 10px; }
    
    .app-card { background: #ffffff; width: 100%; max-width: 420px; height: 92vh; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); display: flex; flex-direction: column; overflow: hidden; position: relative; }
    .hidden { display: none !important; }

    /* Flashlight Screen Effect */
    .screen-flash-active {
      animation: flashStrobe 0.5s infinite alternate;
    }
    @keyframes flashStrobe {
      0% { box-shadow: inset 0 0 0px #ff0000; background-color: rgba(255,255,255,1); }
      100% { box-shadow: inset 0 0 50px #007aff; background-color: rgba(0,122,255,0.2); }
    }

    /* Floating Notification Banner */
    .top-notification-banner {
      position: absolute; top: 12px; left: 4%; width: 92%; background: rgba(20, 20, 20, 0.95);
      color: #ffffff; padding: 12px 16px; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.3);
      z-index: 400; display: flex; align-items: center; justify-content: space-between;
      backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.15);
      animation: slideInDown 0.4s ease-out; cursor: pointer;
    }

    @keyframes slideInDown {
      from { transform: translateY(-80px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .notif-body { display: flex; flex-direction: column; width: 78%; overflow: hidden; }
    .notif-title { font-size: 13px; font-weight: bold; color: #34c759; margin-bottom: 2px; display: flex; align-items: center; gap: 6px; }
    .notif-ticker { white-space: nowrap; font-size: 13px; color: #eee; overflow: hidden; text-overflow: ellipsis; }

    /* Auth Styling */
    .auth-box { padding: 25px 20px; display: flex; flex-direction: column; gap: 12px; justify-content: center; height: 100%; text-align: center; overflow-y: auto; }
    .input-auth { padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px; width: 100%; }
    .btn-auth { background: #007aff; color: white; padding: 12px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 14px; margin-top: 5px; }
    .btn-google { background: #4285f4; color: white; padding: 12px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 14px; }

    /* App Layout */
    .app-header { background: #007aff; color: white; padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; }
    .header-user { font-size: 13px; font-weight: 600; }
    .btn-logout { background: rgba(255, 59, 48, 0.9); color: white; border: none; padding: 4px 8px; border-radius: 4px; font-size: 11px; cursor: pointer; }

    .users-bar { background: #f8f9fa; border-bottom: 1px solid #e9ecef; padding: 8px 10px; }
    .user-list { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 3px; }
    .user-chip { background: #ffffff; border: 1px solid #ced4da; padding: 4px 10px; border-radius: 16px; font-size: 12px; cursor: pointer; white-space: nowrap; display: flex; align-items: center; gap: 5px; }
    .user-chip.active { background: #007aff; color: white; border-color: #007aff; }

    .chat-box { flex: 1; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; background: #fafafa; }
    .msg { padding: 8px 12px; border-radius: 12px; font-size: 13px; max-width: 80%; word-break: break-word; }
    .msg.me { background: #007aff; color: white; align-self: flex-end; }
    .msg.them { background: #e9ecef; color: #212529; align-self: flex-start; }

    .input-bar { padding: 8px; background: #fff; border-top: 1px solid #e9ecef; display: flex; gap: 6px; }
    .input-bar textarea { flex: 1; padding: 8px; border: 1px solid #ced4da; border-radius: 8px; font-size: 13px; resize: none; height: 42px; }
    .btn-send { background: #007aff; color: white; border: none; padding: 0 14px; border-radius: 8px; font-weight: bold; cursor: pointer; }

    /* Call Overlay */
    .call-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.92); color: white; display: flex; flex-direction: column; justify-content: space-between; align-items: center; z-index: 100; text-align: center; padding: 30px 15px; }
    .btn-accept { background: #28a745; color: white; border: none; padding: 12px 28px; border-radius: 25px; font-weight: bold; cursor: pointer; }
    .btn-reject { background: #dc3545; color: white; border: none; padding: 12px 28px; border-radius: 25px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

<div class="app-card" id="appCard">

  <audio id="remoteAudio" autoplay playsinline></audio>
  <div id="recaptcha-container"></div>

  <!-- Banner Notification -->
  <div id="topBanner" class="top-notification-banner hidden" onclick="handleBannerClick()">
    <div class="notif-body">
      <div class="notif-title"><span id="notifIcon">💬</span> <span id="notifSender">...</span></div>
      <div class="notif-ticker" id="notifText">...</div>
    </div>
    <span style="font-size: 11px; background: rgba(255,255,255,0.2); padding: 4px 8px; border-radius: 10px;">ဖွင့်ရန်</span>
  </div>

  <!-- 1. Auth Section -->
  <div id="authSection" class="auth-box">
    <h2>အကောင့်ဝင်ရောက်ရန်</h2>
    
    <!-- Email Login -->
    <input type="email" id="emailInput" class="input-auth" placeholder="အီးမေးလ် ထည့်ပါ">
    <input type="password" id="passInput" class="input-auth" placeholder="စကားဝှက် ထည့်ပါ">
    <button class="btn-auth" onclick="loginWithEmail()">Email ဖြင့် ဝင်မည် / အကောင့်ဖွင့်မည်</button>

    <hr style="margin: 10px 0; border: 0.5px solid #eee;">

    <!-- Phone Login -->
    <input type="text" id="phoneInput" class="input-auth" placeholder="+959xxxxxxxxx">
    <button class="btn-auth" style="background: #34c759;" onclick="sendOTP()">ဖုန်းနံပါတ်သို့ OTP ပို့မည်</button>
    
    <div id="otpSection" class="hidden" style="margin-top: 5px;">
      <input type="text" id="otpInput" class="input-auth" placeholder="OTP ၆ လုံး ထည့်ပါ">
      <button class="btn-auth" style="background: #5856d6;" onclick="verifyOTP()">OTP အတည်ပြုမည်</button>
    </div>

    <hr style="margin: 10px 0; border: 0.5px solid #eee;">

    <button class="btn-google" onclick="loginWithGoogle()">Google Account ဖြင့် ဝင်မည်</button>
  </div>

  <!-- 2. Main App Section -->
  <div id="appSection" class="hidden" style="display: flex; flex-direction: column; height: 100%;">
    <div class="app-header">
      <div class="header-user">မိမိ: <span id="userNameDisplay">...</span></div>
      <div>
        <button id="callBtn" class="btn-logout" style="background:#28a745;" onclick="startCall('audio')">📞 Call</button>
        <button class="btn-logout" onclick="confirmLogout()">ထွက်မည်</button>
      </div>
    </div>

    <div class="users-bar">
      <div class="user-list" id="usersList"></div>
    </div>

    <div class="chat-box" id="chatBox"></div>

    <div class="input-bar">
      <textarea id="msgInput" placeholder="စာရိုက်ပါ..."></textarea>
      <button class="btn-send" onclick="sendMessage()">ပို့မည်</button>
    </div>
  </div>

  <!-- 3. Call Overlay -->
  <div id="callOverlay" class="call-overlay hidden">
    <h3 id="callStatusText">ဖုန်းခေါ်ဆိုနေပါသည်...</h3>
    <p id="callerNameText"></p>
    <div id="callActions">
      <button class="btn-reject" onclick="endCall()">ဖုန်းချမည်</button>
    </div>
  </div>

</div>

<script>
  // ထည့်သွင်းထားသော တရားဝင် API Key များ
  const SENDBIRD_APP_ID = "VowcxoA6jriMLJ8YvcNI87nCu6gV2inBw34nTIuccnw";
  
  const firebaseConfig = {
    apiKey: "AIzaSyCxM61dhkI992k0SZZQNRimqEIp5DM4PaE",
    authDomain: "phone-call-bcb5d.firebaseapp.com",
    projectId: "phone-call-bcb5d",
    storageBucket: "phone-call-bcb5d.firebasestorage.app",
    messagingSenderId: "479656547247",
    appId: "1:479656547247:web:d6ae8a8903282e3856955a",
    measurementId: "G-TS8HYPV8VE"
  };

  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  // SendBird Init (If SendBird SDK is loaded)
  let sb = null;
  if (typeof SendBird !== 'undefined') {
    sb = new SendBird({ appId: SENDBIRD_APP_ID });
  }

  let currentUser = null;
  let selectedUser = null;
  let confirmationResultObj = null;
  let audioCtx = null;

  window.onload = () => {
    window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', {
      'size': 'invisible'
    });
  };

  auth.onAuthStateChanged(user => {
    if (user) {
      currentUser = user;
      document.getElementById('authSection').classList.add('hidden');
      document.getElementById('appSection').classList.remove('hidden');
      document.getElementById('userNameDisplay').innerText = user.displayName || user.email || user.phoneNumber;

      // Connect to SendBird User Session
      if (sb) {
        sb.connect(user.uid, (sbUser, err) => {
          if (!err) {
            sb.updateCurrentUserInfo(user.displayName || user.email || user.phoneNumber, null, null);
          }
        });
      }

      db.collection("users").doc(user.uid).set({
        name: user.displayName || user.email || user.phoneNumber,
        uid: user.uid,
        online: true
      }, { merge: true });

      listenUsers();
      listenIncomingCalls();
      listenMessages();
    } else {
      document.getElementById('authSection').classList.remove('hidden');
      document.getElementById('appSection').classList.add('hidden');
    }
  });

  // Auth Functions
  function loginWithGoogle() {
    const provider = new firebase.auth.GoogleAuthProvider();
    auth.signInWithPopup(provider).catch(e => alert(e.message));
  }

  function loginWithEmail() {
    const email = document.getElementById('emailInput').value;
    const pass = document.getElementById('passInput').value;
    auth.signInWithEmailAndPassword(email, pass).catch(() => {
      auth.createUserWithEmailAndPassword(email, pass).catch(e => alert(e.message));
    });
  }

  function sendOTP() {
    const phoneNumber = document.getElementById('phoneInput').value;
    const appVerifier = window.recaptchaVerifier;
    auth.signInWithPhoneNumber(phoneNumber, appVerifier)
      .then(result => {
        confirmationResultObj = result;
        document.getElementById('otpSection').classList.remove('hidden');
        alert("OTP ပို့ပြီးပါပြီ။");
      }).catch(e => alert(e.message));
  }

  function verifyOTP() {
    const code = document.getElementById('otpInput').value;
    confirmationResultObj.confirm(code).catch(e => alert("OTP မမှန်ပါ: " + e.message));
  }

  function confirmLogout() {
    if (currentUser) db.collection("users").doc(currentUser.uid).update({ online: false });
    if (sb) sb.disconnect();
    auth.signOut();
  }

  // Strobe Notification & Beep Sound
  function triggerStrobeNotification() {
    const appCard = document.getElementById('appCard');
    appCard.classList.add('screen-flash-active');
    setTimeout(() => appCard.classList.remove('screen-flash-active'), 3000);
    
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      osc.connect(audioCtx.destination);
      osc.frequency.value = 800;
      osc.start();
      osc.stop(audioCtx.currentTime + 0.3);
    } catch(e) {}
  }

  function listenUsers() {
    db.collection("users").onSnapshot(snap => {
      const list = document.getElementById('usersList');
      list.innerHTML = '';
      snap.forEach(doc => {
        const u = doc.data();
        if (u.uid !== currentUser.uid) {
          const div = document.createElement('div');
          div.className = `user-chip ${selectedUser && selectedUser.uid === u.uid ? 'active' : ''}`;
          div.innerText = u.name;
          div.onclick = () => { selectedUser = u; listenMessages(); };
          list.appendChild(div);
        }
      });
    });
  }

  function listenMessages() {
    if (!selectedUser) return;
    const roomId = currentUser.uid < selectedUser.uid ? `${currentUser.uid}_${selectedUser.uid}` : `${selectedUser.uid}_${currentUser.uid}`;
    
    db.collection("chats").doc(roomId).collection("messages").orderBy("timestamp", "asc")
      .onSnapshot(snap => {
        const box = document.getElementById('chatBox');
        box.innerHTML = '';
        snap.forEach(doc => {
          const m = doc.data();
          const div = document.createElement('div');
          div.className = `msg ${m.senderUid === currentUser.uid ? 'me' : 'them'}`;
          div.innerText = m.text;
          box.appendChild(div);
        });
        box.scrollTop = box.scrollHeight;
      });
  }

  function sendMessage() {
    if (!selectedUser) return alert("လူရွေးပါ");
    const input = document.getElementById('msgInput');
    if (!input.value.trim()) return;
    
    const roomId = currentUser.uid < selectedUser.uid ? `${currentUser.uid}_${selectedUser.uid}` : `${selectedUser.uid}_${currentUser.uid}`;
    db.collection("chats").doc(roomId).collection("messages").add({
      text: input.value,
      senderUid: currentUser.uid,
      timestamp: firebase.firestore.FieldValue.serverTimestamp()
    }).then(() => input.value = '');
  }

  function listenIncomingCalls() {
    db.collection("calls").where("receiverUid", "==", currentUser.uid).where("status", "==", "calling")
      .onSnapshot(snap => {
        snap.forEach(doc => {
          const data = doc.data();
          triggerStrobeNotification();
          document.getElementById('callOverlay').classList.remove('hidden');
          document.getElementById('callStatusText').innerText = "ဖုန်းဝင်လာပါသည်!";
          document.getElementById('callerNameText').innerText = data.callerName;
          document.getElementById('callActions').innerHTML = `
            <button class="btn-accept" onclick="acceptCall('${doc.id}')">ကိုင်မည်</button>
            <button class="btn-reject" onclick="endCall('${doc.id}')">ငြင်းမည်</button>
          `;
        });
      });
  }

  async function startCall() {
    if (!selectedUser) return alert("ဖုန်းခေါ်ဆိုရန် လူရွေးပါ");
    const callId = currentUser.uid < selectedUser.uid ? `${currentUser.uid}_${selectedUser.uid}` : `${selectedUser.uid}_${currentUser.uid}`;
    
    await db.collection("calls").doc(callId).set({
      callerUid: currentUser.uid,
      callerName: currentUser.displayName || currentUser.email,
      receiverUid: selectedUser.uid,
      status: "calling"
    });

    document.getElementById('callOverlay').classList.remove('hidden');
    document.getElementById('callStatusText').innerText = "ဖုန်းခေါ်ဆိုနေပါသည်...";
  }

  function acceptCall(callId) {
    db.collection("calls").doc(callId).update({ status: "connected" });
    document.getElementById('callStatusText').innerText = "စကားပြောနေပါသည်...";
  }

  function endCall(callId) {
    if(callId) db.collection("calls").doc(callId).update({ status: "ended" });
    document.getElementById('callOverlay').classList.add('hidden');
  }
</script>
</body>
                                                                          </html>
